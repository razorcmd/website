name: Linux RDP with ngrok

on: [push, workflow_dispatch] # Akan berjalan saat push atau manual trigger

jobs:
  build:
    runs-on: ubuntu-latest # <-- Menggunakan runner Linux (Ubuntu) terbaru

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Untuk memastikan file-file repo Anda tersedia

    - name: Update apt and install desktop environment, xrdp
      run: |
        sudo apt-get update # Update daftar paket
        # Instal SSH, RDP server (xrdp), dan desktop environment LXDE
        sudo apt-get install -y openssh-server xrdp lxde 
        sudo systemctl enable xrdp # Aktifkan service xrdp
        sudo systemctl start xrdp  # Mulai service xrdp
        sudo ufw allow 3389/tcp    # Izinkan koneksi RDP di firewall (port 3389)

    - name: Download ngrok for Linux
      run: |
        curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip -o ngrok.zip
        unzip ngrok.zip
        chmod +x ngrok

    - name: Authenticate ngrok
      run: ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    
    # Tambahkan baris kosong setelah blok 'env:'

    - name: Create RDP User and Configure Desktop Environment
      run: |
        sudo useradd -m -s /bin/bash runneruser # Buat user baru 'runneruser'
        echo "runneruser:P@ssw0rd!" | sudo chpasswd # <-- Set password (GANTI "P@ssw0rd!" dengan password kuat Anda)
        sudo adduser runneruser sudo # Beri hak sudo pada user baru (opsional, tapi seringkali dibutuhkan)
        
        # Membuat /etc/xrdp/startwm.sh dengan pipa langsung (versi D-Bus baru)
        sudo rm -f /etc/xrdp/startwm.sh
        
        # Tulis konten script secara langsung sebagai string multi-baris YAML dan pipe ke sudo tee
        echo '
#!/bin/bash
        if test -z "\$DBUS_SESSION_BUS_ADDRESS"; then # <--- PERUBAHAN DI SINI: \$DBUS
          eval "\$(dbus-launch --sh-syntax)" # <--- PERUBAHAN DI SINI: \$(dbus-launch
        fi
        export XDG_CONFIG_DIRS=/etc/xdg:\${XDG_CONFIG_DIRS:-/etc/xdg} # <--- PERUBAHAN DI SINI: \${XDG
        export XDG_DATA_DIRS=/usr/local/share:/usr/share:\${XDG_DATA_DIRS:-/usr/share} # <--- PERUBAHAN DI SINI: \${XDG
        exec dbus-launch --exit-with-session startlxde
' | sudo tee /etc/xrdp/startwm.sh > /dev/null
        
        sudo chmod +x /etc/xrdp/startwm.sh # Pastikan skrip bisa dieksekusi
        
        sudo usermod -a -G ssl-cert runneruser
        sudo usermod -a -G xrdp runneruser
        
        sudo systemctl restart xrdp 
    
    - name: Create ngrok Tunnel
      run: ./ngrok tcp 3389 --log stdout > ngrok.log 2>&1 &
    
    - name: Get ngrok Tunnel URL
      run: |
        sleep 15
        cat ngrok.log
    
    - name: Keep Job Alive
      run: sleep 6h 

  code-review: # Job baru untuk Code Reviewer
    runs-on: ubuntu-latest # Runner untuk job ini

    on: pull_request 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # Untuk mengakses kode yang akan direview
      with:
        fetch-depth: 0 # Penting untuk review code yang komprehensif

    - name: Gemini AI Code Reviewer
      uses: truongnhp1992/gemini-ai-code-re@v6.5.0 # Menggunakan Action Gemini Code Reviewer versi 6.5.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }} # Token GitHub bawaan untuk otentikasi
        google_gemini_api_key: ${{ secrets.GOOGLE_GEMINI_API_KEY }} # <--- PENTING: Anda harus setting ini sebagai GitHub Secret
        # gemini_model: 'gemini-pro' # Opsional: Anda bisa tentukan model Gemini yang digunakan, defaultnya biasanya 'gemini-pro'
